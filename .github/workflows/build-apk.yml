name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Bundle fonts (offline)
        run: node scripts/prepare-fonts.mjs

      - name: Generate Android project
        run: npx cap add android

      - name: Patch Android project
        run: node scripts/patch-android.mjs

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Verify APK contents
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          N=$(unzip -l "$APK" | grep -c 'assets/public/fonts/.*\.woff2' || true)
          echo "woff2 di dalam APK: $N"
          test "$N" -ge 3
          unzip -l "$APK" | grep -q 'assets/public/fonts/fonts.css'
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          ! unzip -p "$APK" assets/public/index.html | grep -q 'fonts.googleapis.com'

      - uses: actions/upload-artifact@v4
        with:
          name: ma-habbit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
